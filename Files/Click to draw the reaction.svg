<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ff"/>
      <stop offset="1" stop-color="#eeeafd"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="557" height="147" rx="14" fill="url(#bg)" stroke="#8f84db" stroke-width="1.6" stroke-dasharray="7 5"/>

  <!-- mini scheme: benzene ring → product, with a reagent table under it -->
  <g fill="none" stroke="#4a3fa3" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="52,30 70,40.4 70,61.2 52,71.6 34,61.2 34,40.4"/>
    <line x1="39" y1="43.3" x2="39" y2="58.3"/>
    <line x1="52" y1="35.8" x2="65" y2="43.3"/>
    <line x1="52" y1="65.8" x2="65" y2="58.3"/>
    <line x1="70" y1="40.4" x2="82" y2="33.5"/>
    <line x1="86" y1="51" x2="122" y2="51"/>
    <polygon points="122,51 113,46.5 113,55.5" fill="#4a3fa3"/>
    <polygon points="152,30 170,40.4 170,61.2 152,71.6 134,61.2 134,40.4"/>
    <line x1="139" y1="43.3" x2="139" y2="58.3"/>
    <line x1="152" y1="35.8" x2="165" y2="43.3"/>
    <line x1="152" y1="65.8" x2="165" y2="58.3"/>
    <line x1="170" y1="40.4" x2="182" y2="33.5"/>
    <line x1="182" y1="33.5" x2="194" y2="40.4"/>
  </g>
  <g fill="none" stroke="#8f84db" stroke-width="1.3">
    <rect x="30" y="88" width="166" height="40" rx="3" fill="#ffffff"/>
    <line x1="30" y1="101.5" x2="196" y2="101.5"/>
    <line x1="30" y1="114.8" x2="196" y2="114.8"/>
    <line x1="85" y1="88" x2="85" y2="128"/>
    <line x1="140" y1="88" x2="140" y2="128"/>
  </g>
  <rect x="30" y="88" width="166" height="13.5" rx="3" fill="#dcd6fb"/>

  <!-- pencil -->
  <g transform="translate(214 100) rotate(-40)">
    <rect x="0" y="-5" width="34" height="10" rx="1.5" fill="#6b5fd0"/>
    <rect x="28" y="-5" width="6" height="10" fill="#f0a3b8"/>
    <polygon points="0,-5 -10,0 0,5" fill="#f3d8a8"/>
    <polygon points="-6.4,-1.8 -10,0 -6.4,1.8" fill="#3b2f8f"/>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
    <text x="252" y="52" font-size="21" font-weight="700" fill="#3b2f8f">Click to draw the reaction</text>
    <text x="252" y="78" font-size="21" font-weight="700" fill="#3b2f8f">and the reagent table</text>
    <text x="252" y="106" font-size="13.5" fill="#6a60b3">Opens Reactio Draw</text>
    <text x="252" y="125" font-size="13.5" fill="#6a60b3">Ctrl/Cmd+S or Ctrl/Cmd+W: save and close</text>
  </g>
</svg>
